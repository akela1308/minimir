const LKEY='minimir_lang',LDEF='en';
let LANG=(()=>{try{return localStorage.getItem(LKEY)||LDEF}catch(e){return LDEF}})();
if(!I18N[LANG])LANG=LDEF;
function t(k){return (I18N[LANG]||I18N.en)[k];}

// ---------- парный эксперимент ----------
const BLOCK=8000;                 // измерительный блок (тиков); 1-й блок — прогрев
let POOL=null,LIVECFG=null,engS=null,engC=null,trial=0,blockIdx=0,SPEED=1,peakS=0;
const cvS=document.getElementById('wS'),ctxS=cvS.getContext('2d');
const cvC=document.getElementById('wC'),ctxC=cvC.getContext('2d');
const off=document.createElement('canvas'),octx=off.getContext('2d');
let H,W,SCS,SCC,img;
const splash=document.getElementById('splash');

function unpackGenome(b64){const bin=atob(b64),by=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)by[i]=bin.charCodeAt(i);const f=new Float32Array(by.buffer);
  return{W1:f.slice(0,300),b1:f.slice(300,312),W2:f.slice(312,456),b2:f.slice(456,468)};}
function rndSeed(){return (Math.floor(Math.random()*4294967295))>>>0;}
function newTrial(){
  const seed=rndSeed(),anc=POOL[(Math.random()*POOL.length)|0];
  engS=new MiniWorld.Engine(seed,Object.assign({},LIVECFG,{interoMode:'self'}),anc);
  engC=new MiniWorld.Engine(seed,Object.assign({},LIVECFG,{interoMode:'shuffled'}),anc);
  trial++;blockIdx=0;peakS=0;
  H=engS.cfg.H;W=engS.cfg.W;off.width=W;off.height=H;img=octx.createImageData(W,H);
  SCS=cvS.width/W;SCC=cvC.width/W;splash.style.display='none';
}
function energyColor(e){var t=e/255,r,g,b;
  if(t<.5){var u=t/.5;r=0xe8+(0xd9-0xe8)*u;g=0x73+(0xc2-0x73)*u;b=0x4a+(0x6a-0x4a)*u;}
  else{var u2=(t-.5)/.5;r=0xd9+(0x46-0xd9)*u2;g=0xc2+(0xc6-0xc2)*u2;b=0x6a+(0xd0-0x6a)*u2;}
  return `rgb(${r|0},${g|0},${b|0})`;}
function drawWorld(eng,ctx,cvw,SC){
  const d=img.data,cap=eng.capacity,res=eng.resource;
  for(let i=0;i<W*H;i++){const c=cap[i],r=res[i];
    d[i*4]=10+20*r;d[i*4+1]=26*c+(18*c+150*r)*0.9;d[i*4+2]=20*c+40*r;d[i*4+3]=255;}
  octx.putImageData(img,0,0);ctx.imageSmoothingEnabled=false;
  ctx.clearRect(0,0,cvw.width,cvw.height);ctx.drawImage(off,0,0,cvw.width,cvw.height);
  ctx.fillStyle='rgba(230,193,74,0.8)';
  for(let i=0;i<W*H;i++)if(Math.abs(eng.signs[i*2])+Math.abs(eng.signs[i*2+1])>0.02)
    ctx.fillRect((i%W)*SC,((i/W)|0)*SC,SC,SC);
  for(let a=0;a<eng.cfg.maxPop;a++)if(eng.alive[a]){
    ctx.fillStyle=energyColor(Math.max(0,Math.min(255,eng.E[a]/eng.cfg.eMax*255)));
    ctx.fillRect(eng.x[a]*SC-0.5,eng.y[a]*SC-0.5,SC+1,SC+1);}
}

// ---------- накопление и вердикт ----------
const SKEY='minimir_blocks';
function loadBlocks(){try{return JSON.parse(localStorage.getItem(SKEY))||[]}catch(e){return[]}}
function recordBlock(rec){let a=loadBlocks();a.push(rec);if(a.length>500)a=a.slice(-500);
  try{localStorage.setItem(SKEY,JSON.stringify(a))}catch(e){}
  if(window.MINIMIR_ENDPOINT){try{fetch(window.MINIMIR_ENDPOINT,{method:'POST',mode:'no-cors',
    headers:{'Content-Type':'application/json'},body:JSON.stringify(rec)});}catch(e){}}
  renderVerdict();renderLog();}
function mean(a){return a.reduce((x,y)=>x+y,0)/a.length;}
function sd(a){if(a.length<2)return 0;const m=mean(a);return Math.sqrt(a.reduce((s,v)=>s+(v-m)*(v-m),0)/(a.length-1));}
function renderVerdict(){
  const b=loadBlocks(),n=b.length;
  const S=document.getElementById('v_big'),sub=document.getElementById('v_sub'),say=document.getElementById('v_say');
  if(n<8){S.textContent='—';sub.textContent=`${n} / 8 ${t('v_blocks')}`;
    say.className='say wait';say.textContent=t('v_wait');return;}
  const dif=b.map(x=>x.diff),self=b.map(x=>x.self);
  const md=mean(dif),se=sd(dif)/Math.sqrt(n),ci=2*se,noise=2*sd(self);
  S.textContent=(md>=0?'+':'')+md.toFixed(4)+' '+t('v_bits');
  sub.innerHTML=`${t('v_delta')} · ${t('v_ci')} ±${ci.toFixed(4)} · ${t('v_noise')} ${noise.toFixed(4)} · ${n} ${t('v_blocks')}`;
  const ciLow=md-ci;
  if(ciLow>0&&md>noise){say.className='say eff';say.textContent=t('v_eff');}
  else if(ciLow>0){say.className='say weak';say.textContent=t('v_weak');}
  else{say.className='say none';say.textContent=t('v_none');}
}
function renderLog(){
  const b=loadBlocks();
  const self=b.map(x=>x.self),shuf=b.map(x=>x.shuf),dif=b.map(x=>x.diff);
  document.getElementById('agg').innerHTML=[
    [t('a_blocks'),b.length],
    [t('a_self'),b.length?mean(self).toFixed(4):'—'],
    [t('a_shuf'),b.length?mean(shuf).toFixed(4):'—'],
    [t('a_diff'),b.length?((mean(dif)>=0?'+':'')+mean(dif).toFixed(4)):'—'],
  ].map(([k,v])=>`<div class="aggcard"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('');
  document.getElementById('thead').innerHTML='<tr>'+['c_t','c_self','c_shuf','c_diff'].map(k=>`<th>${t(k)}</th>`).join('')+'</tr>';
  document.getElementById('tbody').innerHTML=b.slice().reverse().slice(0,50).map(e=>
    `<tr><td>${e.trial}</td><td>${e.self.toFixed(4)}</td><td>${e.shuf.toFixed(4)}</td>`+
    `<td style="color:${e.diff>=0?'var(--coop)':'var(--amber)'}">${(e.diff>=0?'+':'')+e.diff.toFixed(4)}</td></tr>`).join('');
}

// ---------- приборы ----------
const GA=[{k:'g_pop',u:'g_pop_u',c:'#8fd6dd',get:()=>engS.pop,fmt:v=>v},
  {k:'g_smi',u:'g_mi_u',c:'#46c6d0',get:()=>engS.miWindow(),fmt:v=>v==null?'—':v.toFixed(3)},
  {k:'g_cmi',u:'g_mi_u',c:'#e8734a',get:()=>engC.miWindow(),fmt:v=>v==null?'—':v.toFixed(3)},
  {k:'g_coop',u:'g_coop_u',c:'#4fd08a',get:()=>engS.coopRate(),fmt:v=>v==null?'—':v.toFixed(2)}];
let gEls=[];
function buildGauges(){const r=document.getElementById('gauges');r.innerHTML='';gEls=[];
  for(const g of GA){const el=document.createElement('div');el.className='gauge';
    el.innerHTML=`<div class="lbl">${t(g.k)}</div><div class="val"><span data-v>—</span> <span class="unit">${t(g.u)}</span></div>`;
    r.appendChild(el);gEls.push({g,val:el.querySelector('[data-v]')});}}
function updateGauges(){for(const {g,val} of gEls){const v=g.get();val.textContent=v==null?'—':g.fmt(v);}}

// ---------- цикл ----------
function loop(){
  if(engS&&engC){
    for(let i=0;i<SPEED;i++){
      const aS=engS.step(),aC=engC.step();
      if(!aS||!aC){newTrial();break;}            // любой вымер -> новая пара
      if(engS.pop>peakS)peakS=engS.pop;
      if(engS.tick%BLOCK===0){
        if(blockIdx>=1){                          // 1-й блок (0) — прогрев
          const mS=engS.miWindow(),mC=engC.miWindow();
          if(mS!=null&&mC!=null&&engS.occupiedDeciles()>=4&&engC.occupiedDeciles()>=4)
            recordBlock({trial:trial,self:mS,shuf:mC,diff:mS-mC,ts:Date.now()});
        }
        blockIdx++;engS.resetWindow();engC.resetWindow();
      }
    }
    drawWorld(engS,ctxS,cvS,SCS);drawWorld(engC,ctxC,cvC,SCC);
    const socS=engS.tick>=engS.cfg.socialFromTick;
    document.getElementById('hudS').innerHTML=`${t('hud_pop')} ${engS.pop} · ${socS?t('hud_social'):t('hud_warm')}`;
    document.getElementById('hudC').innerHTML=`${t('hud_pop')} ${engC.pop}`;
    updateGauges();
  }
  requestAnimationFrame(loop);
}

// ---------- язык ----------
function applyLang(l){
  if(!I18N[l])l=LDEF;LANG=l;try{localStorage.setItem(LKEY,l)}catch(e){}
  document.documentElement.lang=l;const S=id=>document.getElementById(id);
  S('t_eye').textContent=t('eye');S('t_about').textContent=t('about');S('t_rec').textContent=t('rec');S('t_journal').textContent=t('journal');
  S('t_brand').innerHTML=t('brand');S('t_live').textContent=t('live');S('t_lede').textContent=t('lede');
  S('t_self').textContent=t('self');S('t_ctrl').textContent=t('ctrl');
  S('t_speed').textContent=t('speed');S('newbtn').textContent=t('newpair');
  S('t_verdict_h').textContent=t('verdict_h');S('t_how_h').textContent=t('how_h');
  S('t_coop_h').textContent=t('coop_h');S('t_log_h').textContent=t('log_h');
  S('clearbtn').textContent=t('clear');S('t_foot').innerHTML=t('foot');
  S('howbox').innerHTML=t('how');S('splash').textContent=t('seeding');
  S('coopbox').innerHTML=`${t('coop')}
    <div class="flow"><div class="fc g"><div class="ft">${t('give_t')}</div><div class="ln">${t('give_l1')}</div><div class="ln">${t('give_l2')}</div><div class="net">${t('give_net')}</div></div>
    <div class="fc t"><div class="ft">${t('take_t')}</div><div class="ln">${t('take_l1')}</div><div class="ln">${t('take_l2')}</div><div class="net" style="color:var(--amber);border-color:#4a3323">${t('take_net')}</div></div></div>
    <p style="margin:10px 0 0">${t('coop_after')}</p>`;
  document.querySelectorAll('.langbar button').forEach(b=>b.classList.toggle('on',b.dataset.set===l));
  buildGauges();renderVerdict();renderLog();
}
document.querySelector('.langbar').addEventListener('click',e=>{const b=e.target.closest('button[data-set]');if(b)applyLang(b.dataset.set);});
document.getElementById('speed').addEventListener('click',e=>{const b=e.target.closest('button[data-s]');if(!b)return;
  SPEED=+b.dataset.s;document.querySelectorAll('#speed button').forEach(x=>x.classList.toggle('on',x===b));});
document.getElementById('newbtn').onclick=()=>{if(POOL)newTrial();};
document.getElementById('clearbtn').onclick=()=>{try{localStorage.removeItem(SKEY)}catch(e){}renderVerdict();renderLog();};

applyLang(LANG);
splash.style.display='flex';splash.textContent=t('seeding');
// параметры мира: maxPop заведомо большой (НЕ связывает — плотность регулирует
// физика/еда, а не потолок), плодородность умеренная (популяция ~400-600 для
// плавности двух миров). Берём из json только предков, не мировые параметры.
fetch('ancestors.json').then(r=>r.json()).then(d=>{
  LIVECFG={maxPop:2000,crowdCost:0.06,regrowth:0.004,patchThreshold:0.62};
  POOL=d.ancestors.map(unpackGenome);newTrial();loop();})
  .catch(err=>{splash.textContent='error: '+err;});
</script>
