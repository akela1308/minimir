  p3:"What was predicted in advance. By the model of Kozielska and Weissing (2024), learning evolves only where the environment changes often, strongly and unpredictably, while in a stationary environment the innate wins and learning is selected away. Our July pilot showed the second half: in an unchanging world the learning speed halved. Here both halves are tested at once: in the changing world the speed gene should grow by an order of magnitude, in the stationary one it should not.",
  p4:"An honest caveat. The first switch is a bottleneck: most creatures with an innate taste will be poisoned or starve, and the survivors are those who managed to relearn. Sometimes nobody survives, and the world restarts. That is not a bug but a failure boundary declared in advance (preregistration B, §7.3), and in the journal such runs are counted separately.",

  v_dead_s:"мир не выдержал смены правила: популяция вымерла, перезапуск через 5 секунд.",
  v_dead_c:"стационарный мир вымер, перезапуск через 5 секунд.",
  g_lr:"ген скорости обучения",g_lr_u:"медиана, лог. шкала",

  how_h:"что здесь происходит",
  p1:"Мир тот же, что в первом эксперименте: сетка, еда, существа с крошечной нейросетью, никакой награды и никакого судьи. Размножается тот, кто наел энергию. Добавлено одно: еда бывает двух цветов, и в каждый момент один цвет питателен, а другой ядовит (укус отнимает половину того, что дал бы питательный).",
  p2:"В большом мире правило переворачивается в случайные моменты, в среднем раз в 600 тиков, примерно одна жизнь. Записать такое в геном нельзя: моменты непредсказуемы. Выучить при жизни можно: у каждого существа есть вкус, одна связь «цвет → есть», и она меняется по трёхфакторному правилу: что ел, что получил (еду или яд), с какой скоростью учишься. Скорость обучения это ген: наследуется, мутирует, и отбор может её поднять или опустить. В малом мире всё то же, только правило не меняется никогда.",
  p3:"Что предсказано заранее. По модели Kozielska и Weissing (2024) обучение эволюционирует только там, где среда меняется часто, сильно и непредсказуемо, а в стационарной среде выигрывает врождённое, и обучение отбирается прочь. Наш июльский пилот показал второе: в неизменном мире скорость обучения упала вдвое. Здесь проверяются оба плеча сразу: в меняющемся мире ген скорости должен вырасти на порядок, в стационарном не должен.",
  p4:"Честная оговорка. Первая смена правила это узкое горлышко: большинство существ с врождённым вкусом отравится или оголодает, выживут те, кто успел переучиться. Иногда не выживает никто, и мир перезапускается. Это не сбой, а граница провала, объявленная заранее (предрегистрация B, §7.3), и в журнале такие прогоны считаются отдельно.",
  p5:"Что здесь настоящее, а что нет. Мир в вашей вкладке считается по-настоящему, но это витрина метода: одно семя, одна пара миров, всё исчезает вместе с вкладкой. Числа, на которые мы опираемся, копятся отдельно: каждый день на серверах GitHub считаются шесть условий на новых семенах, и журнал наблюдений пересчитывает статистику по всему накопленному. Объявленные чтения: 10, 20 и 40 семян. В вашей вкладке от суточного прогона отличаются четыре вещи: врождённый вкус слабее, стартовая скорость обучения выше, социальный слой выключен, прогрев короче. Иначе почти каждый мир гибнет на первой же смене, потому что переучивание стоит больше энергии, чем у существа есть. Сравнение двух миров от этого не страдает: у обоих старт одинаковый.",
  links:'<a href="https://github.com/akela1308/minimir/blob/main/PREREGISTRATION_B.md" target="_blank" rel="noopener">Предрегистрация B: гипотезы, критерии, границы провала</a> · <a href="journal.html">Журнал наблюдений</a> · <a href="interoception.html">Эксперимент 1: интероцепция (продолжается раз в неделю)</a>',
  log_h:"накопленные эпизоды в этом браузере",
  a_eps:"эпизодов",a_ratio:"медиана отношения",a_dead:"вымерло меняющихся",

  out_alive:"жив",out_dead:"вымер",clear:"очистить",
  foot:'Проект и тексты: <a href="https://www.ilinmaks.com/" target="_blank" rel="noopener">Максим Ильин</a>, AI-инженер и AI-консультант · <a href="https://www.linkedin.com/in/ilinmaks/" target="_blank" rel="noopener">LinkedIn</a> · Живая браузерная витрина метода, спутник исследования, а не его источник. Накопленные числа: <a href="journal.html">журнал</a> · <a href="about.html">о проекте</a> · <a href="https://github.com/akela1308/minimir" target="_blank" rel="noopener">github</a>.'},

 de:{eye:"künstliches leben · experiment 2 · live",exp1:"Experiment 1 ↗",journal:"Journal ↗",agi:"AGI ↗",about:"über ↗",live:"live",
  brand:'wann lernen sich <span class="dot">lohnt</span>',
  lede:"Zwei Welten aus einem Samen. In der einen ändert sich die Regel nie: Farbe +1 ist Nahrung, Farbe -1 ist Gift. In der anderen kippt die Regel zu unvorhersehbaren Zeitpunkten, im Schnitt einmal pro Leben. Das Einzige, was die Wesen zu Lebzeiten lernen können, ist der Geschmack: welche Farbe man isst. Die Geschwindigkeit dieses Lernens steht im Genom. Wir schauen, ob die Selektion sie dort einschaltet, wo die Welt die Regeln ändert, und dort abschaltet, wo sie es nicht tut.",
  wswitch:"die Regel ändert sich, im Schnitt alle 600 Ticks",wstat:"die Regel ändert sich nie",
  lg_edible:"jetzt essbar",lg_toxic:"jetzt giftig",lg_creature:"Wesen (Helligkeit = Energie)",
  hud_tick:"Tick",hud_pop:"Wesen",hud_since:"seit dem letzten Wechsel",hud_good:"jetzt essbar: Farbe",
  switched:"die Regel ist gekippt",
  speed:"Tempo",newworld:"↻ neue Welt",seeding:"säe eine lebensfähige Welt…",
  verdict_h:"Gen der Lerngeschwindigkeit",
  v_switch:"wechselnd",v_stat:"stationär",
  v_warm:"Aufwärmen: die Regel hat sich noch nicht geändert.",
  v_on:"Selektion hat das Lernen eingeschaltet: in der wechselnden Welt wuchs das Geschwindigkeitsgen um das {n}-fache.",
  v_grow:"wächst, aber noch nicht zehnfach.",
  v_same:"bisher kein Unterschied.",
  v_dead_s:"die Welt hat den Regelwechsel nicht überstanden: die Population starb aus, Neustart in 5 Sekunden.",
  v_dead_c:"die stationäre Welt ist ausgestorben, Neustart in 5 Sekunden.",
  g_lr:"Gen der Lerngeschwindigkeit",g_lr_u:"Median, log. Skala",
  g_taste:"angeborener Geschmack",g_taste_u:"Mittel der Genome",
  g_acc:"Essgenauigkeit",g_acc_u:"Anteil essbarer Bisse",
  g_sw:"Regelwechsel",g_sw_u:"in dieser Welt",
  how_h:"was hier geschieht",
  p1:"Die Welt ist dieselbe wie im ersten Experiment: ein Gitter, Nahrung, Wesen mit einem winzigen neuronalen Netz, keine Belohnung und kein Richter. Wer genug Energie frisst, pflanzt sich fort. Eines kommt hinzu: Nahrung gibt es in zwei Farben, und zu jedem Zeitpunkt ist eine Farbe nahrhaft und die andere giftig (ein Biss nimmt die Hälfte dessen, was die nahrhafte gäbe).",
  p2:"In der großen Welt kippt die Regel zu zufälligen Zeitpunkten, im Schnitt alle 600 Ticks, also etwa ein Leben. Ins Genom schreiben lässt sich das nicht: die Zeitpunkte sind unvorhersehbar. Zu Lebzeiten lernen lässt es sich schon: jedes Wesen hat einen Geschmack, eine einzige Verbindung von Farbe zu essen, und sie ändert sich nach einer Drei-Faktoren-Regel: was du gegessen hast, was du bekommen hast (Nahrung oder Gift), und wie schnell du lernst. Die Lerngeschwindigkeit ist ein Gen: vererbt, mutierend, und die Selektion kann sie heben oder senken. Die kleine Welt ist dieselbe, nur ändert sich die Regel nie.",
  p3:"Was vorab vorhergesagt wurde. Nach dem Modell von Kozielska und Weissing (2024) entwickelt sich Lernen nur dort, wo die Umwelt sich oft, stark und unvorhersehbar ändert, während in einer stationären Umwelt das Angeborene gewinnt und Lernen wegselektiert wird. Unser Pilot im Juli zeigte die zweite Hälfte: in einer unveränderlichen Welt halbierte sich die Lerngeschwindigkeit. Hier werden beide Hälften zugleich geprüft: in der wechselnden Welt soll das Geschwindigkeitsgen um eine Größenordnung wachsen, in der stationären nicht.",
  p4:"Eine ehrliche Einschränkung. Der erste Wechsel ist ein Nadelöhr: die meisten Wesen mit angeborenem Geschmack werden vergiftet oder verhungern, und es überleben die, die rechtzeitig umgelernt haben. Manchmal überlebt niemand, und die Welt startet neu. Das ist kein Fehler, sondern eine vorab erklärte Fehlergrenze (Präregistrierung B, §7.3), und im Journal werden solche Läufe getrennt gezählt.",
  p5:"Was hier echt ist und was nicht. Die Welt in deinem Tab wird wirklich gerechnet, aber sie ist ein Schaufenster der Methode: ein Samen, ein Paar Welten, alles verschwindet mit dem Tab. Die Zahlen, auf die wir uns stützen, sammeln sich anderswo: täglich rechnen GitHub-Server sechs Bedingungen auf frischen Samen, und das Beobachtungsjournal rechnet die Statistik über alles Gesammelte neu. Erklärte Ablesungen: 10, 20 und 40 Samen. In deinem Tab unterscheiden sich vier Dinge vom täglichen Lauf: der angeborene Geschmack ist schwächer, die Lerngeschwindigkeit startet höher, die soziale Schicht ist aus und das Aufwärmen ist kürzer. Sonst stirbt fast jede Welt schon beim ersten Wechsel, weil das Umlernen mehr Energie kostet, als ein Wesen besitzt. Der Vergleich der beiden Welten leidet nicht darunter: beide starten vom selben Wert.",
  links:'<a href="https://github.com/akela1308/minimir/blob/main/PREREGISTRATION_B.md" target="_blank" rel="noopener">Präregistrierung B: Hypothesen, Kriterien, Fehlergrenzen</a> · <a href="journal.html">Beobachtungsjournal</a> · <a href="interoception.html">Experiment 1: Interozeption (läuft wöchentlich weiter)</a>',
  log_h:"in diesem Browser gesammelte Episoden",
  a_eps:"Episoden",a_ratio:"Median des Verhältnisses",a_dead:"wechselnde Welten gestorben",
  c_n:"Nr.",c_seed:"Samen",c_ticks:"Ticks",c_lrs:"Geschwindigkeitsgen, wechselnd",c_lrn:"Geschwindigkeitsgen, stationär",c_ratio:"Verhältnis",c_out:"Ausgang",
  out_alive:"lebt",out_dead:"ausgestorben",clear:"gespeicherte Daten löschen",
  foot:'Projekt und Texte: <a href="https://www.ilinmaks.com/" target="_blank" rel="noopener">Maksim Ilin</a>, AI-Ingenieur und AI-Berater · <a href="https://www.linkedin.com/in/ilinmaks/" target="_blank" rel="noopener">LinkedIn</a> · Ein lebendes Schaufenster im Browser, Begleiter der Forschung, nicht ihre Quelle. Gesammelte Zahlen: <a href="journal.html">Journal</a> · <a href="about.html">über</a> · <a href="https://github.com/akela1308/minimir" target="_blank" rel="noopener">github</a>.'},

 es:{eye:"vida artificial · experimento 2 · en vivo",exp1:"experimento 1 ↗",journal:"diario ↗",agi:"AGI ↗",about:"sobre ↗",live:"live",
  brand:'cuándo conviene <span class="dot">aprender</span>',
  lede:"Dos mundos desde una misma semilla. En uno la regla no cambia nunca: el color +1 es comida, el color -1 es veneno. En el otro la regla se invierte en momentos impredecibles, en promedio una vez por vida. Lo único que las criaturas pueden aprender durante su vida es el gusto: qué color comer. La velocidad de ese aprendizaje está escrita en el genoma. Miramos si la selección la enciende donde el mundo cambia las reglas, y la apaga donde no lo hace.",
  wswitch:"la regla cambia, en promedio cada 600 ticks",wstat:"la regla no cambia nunca",
  lg_edible:"comestible ahora",lg_toxic:"venenoso ahora",lg_creature:"criatura (brillo = energía)",
  hud_tick:"tick",hud_pop:"criaturas",hud_since:"desde el último cambio",hud_good:"comestible ahora: color",
  switched:"la regla se ha invertido",
  speed:"velocidad",newworld:"↻ mundo nuevo",seeding:"sembrando un mundo viable…",
  verdict_h:"gen de velocidad de aprendizaje",
  v_switch:"cambiante",v_stat:"estacionario",
  v_warm:"calentamiento: la regla aún no ha cambiado.",
  v_on:"la selección encendió el aprendizaje: en el mundo cambiante el gen de velocidad creció {n} veces.",
  v_grow:"crece, pero todavía menos de diez veces.",
  v_same:"por ahora no hay diferencia.",
  v_dead_s:"el mundo no resistió el cambio de regla: la población se extinguió, reinicio en 5 segundos.",
  v_dead_c:"el mundo estacionario se extinguió, reinicio en 5 segundos.",
  g_lr:"gen de velocidad",g_lr_u:"mediana, escala log.",
  g_taste:"gusto innato",g_taste_u:"media de genomas",
  g_acc:"precisión al comer",g_acc_u:"proporción de bocados comestibles",
  g_sw:"cambios de regla",g_sw_u:"en este mundo",
  how_h:"qué ocurre aquí",
  p1:"El mundo es el del primer experimento: una cuadrícula, comida, criaturas con una red neuronal diminuta, sin recompensa y sin juez. Se reproduce quien acumula energía comiendo. Se añade una cosa: la comida viene en dos colores, y en cada momento un color es nutritivo y el otro venenoso (un bocado quita la mitad de lo que daría el nutritivo).",
  p2:"En el mundo grande la regla se invierte en momentos aleatorios, en promedio cada 600 ticks, aproximadamente una vida. Escribir eso en el genoma es imposible: los momentos son impredecibles. Aprenderlo durante la vida sí se puede: cada criatura tiene un gusto, una sola conexión de color a comer, y cambia según una regla de tres factores: qué comiste, qué recibiste (comida o veneno), y a qué velocidad aprendes. La velocidad de aprendizaje es un gen: se hereda, muta, y la selección puede subirla o bajarla. El mundo pequeño es igual, salvo que la regla no cambia nunca.",
  p3:"Lo predicho de antemano. Según el modelo de Kozielska y Weissing (2024), el aprendizaje evoluciona solo donde el entorno cambia con frecuencia, con fuerza y de forma impredecible, mientras que en un entorno estacionario gana lo innato y el aprendizaje es eliminado por la selección. Nuestro piloto de julio mostró la segunda mitad: en un mundo inmutable la velocidad de aprendizaje cayó a la mitad. Aquí se comprueban ambas mitades a la vez: en el mundo cambiante el gen de velocidad debería crecer un orden de magnitud, en el estacionario no.",
  p4:"Una advertencia honesta. El primer cambio es un cuello de botella: la mayoría de las criaturas con gusto innato se envenenarán o pasarán hambre, y sobreviven las que alcanzaron a reaprender. A veces no sobrevive nadie, y el mundo se reinicia. No es un fallo, sino un límite de fracaso declarado de antemano (preregistro B, §7.3), y en el diario esas corridas se cuentan aparte.",
  p5:"Qué es real aquí y qué no. El mundo de tu pestaña se calcula de verdad, pero es un escaparate del método: una semilla, un par de mundos, todo desaparece con la pestaña. Los números en los que nos apoyamos se acumulan en otro lugar: cada día los servidores de GitHub calculan seis condiciones con semillas nuevas, y el diario de observaciones recalcula la estadística sobre todo lo acumulado. Lecturas declaradas: 10, 20 y 40 semillas. En tu pestaña cuatro cosas difieren de la corrida diaria: el gusto innato es más débil, la velocidad de aprendizaje empieza más alta, la capa social está apagada y el calentamiento es más corto. De lo contrario casi todos los mundos mueren en el primer cambio, porque reaprender costaría más energía de la que una criatura tiene. La comparación entre los dos mundos no se ve afectada: ambos parten del mismo valor.",
  links:'<a href="https://github.com/akela1308/minimir/blob/main/PREREGISTRATION_B.md" target="_blank" rel="noopener">Preregistro B: hipótesis, criterios, límites de fracaso</a> · <a href="journal.html">Diario de observaciones</a> · <a href="interoception.html">Experimento 1: interocepción (continúa cada semana)</a>',
  log_h:"episodios acumulados en este navegador",
  a_eps:"episodios",a_ratio:"mediana de la razón",a_dead:"mundos cambiantes extinguidos",
  c_n:"№",c_seed:"semilla",c_ticks:"ticks",c_lrs:"gen de velocidad, cambiante",c_lrn:"gen de velocidad, estacionario",c_ratio:"razón",c_out:"desenlace",
  out_alive:"vivo",out_dead:"extinguido",clear:"borrar lo guardado",
  foot:'Proyecto y textos: <a href="https://www.ilinmaks.com/" target="_blank" rel="noopener">Maksim Ilin</a>, ingeniero y consultor de IA · <a href="https://www.linkedin.com/in/ilinmaks/" target="_blank" rel="noopener">LinkedIn</a> · Un escaparate vivo en el navegador, compañero de la investigación y no su fuente. Números acumulados: <a href="journal.html">diario</a> · <a href="about.html">sobre</a> · <a href="https://github.com/akela1308/minimir" target="_blank" rel="noopener">github</a>.'},

 zh:{eye:"人工生命 · 实验二 · 实时",exp1:"实验一 ↗",journal:"观察日志 ↗",agi:"AGI ↗",about:"关于 ↗",live:"live",
  brand:'何时<span class="dot">值得学习</span>',
  lede:"同一颗种子，两个世界。一个世界的规则永不改变：颜色 +1 可吃，颜色 -1 有毒。另一个世界的规则会在不可预测的时刻翻转，平均每一生翻转一次。生物在一生之中唯一能学会的，就是口味：该吃哪种颜色。学习的速度写在基因组里。我们要看的是：在规则不断变化的世界里，选择会不会把它打开；在规则不变的世界里，会不会把它关掉。",
  wswitch:"规则会变，平均每 600 步一次",wstat:"规则永不改变",
  lg_edible:"当前可吃",lg_toxic:"当前有毒",lg_creature:"生物（亮度即能量）",
  hud_tick:"步",hud_pop:"个体",hud_since:"距上次翻转",hud_good:"当前可吃：颜色",
  switched:"规则翻转了",
  speed:"速度",newworld:"↻ 新世界",seeding:"正在播种一个可存活的世界…",
  verdict_h:"学习速度基因",
  v_switch:"变化世界",v_stat:"稳定世界",
  v_warm:"预热中：规则尚未改变。",
  v_on:"选择打开了学习：在变化的世界里，速度基因增长了 {n} 倍。",
  v_grow:"在增长，但还不到十倍。",
  v_same:"目前没有差别。",
  v_dead_s:"这个世界没能挺过规则翻转：种群灭绝，5 秒后重启。",
  v_dead_c:"稳定世界灭绝了，5 秒后重启。",
  g_lr:"学习速度基因",g_lr_u:"中位数，对数刻度",
  g_taste:"先天口味",g_taste_u:"基因组均值",
  g_acc:"进食准确率",g_acc_u:"可吃食物占比",
  g_sw:"规则翻转次数",g_sw_u:"在此世界",
  how_h:"这里发生了什么",
  p1:"世界和第一个实验一样：一张网格、食物、带有微型神经网络的生物，没有奖励，也没有裁判。吃够能量的才会繁殖。只加了一件事：食物有两种颜色，而在任一时刻，一种颜色有营养，另一种有毒（咬一口会失去有营养的那种本可提供的一半）。",
  p2:"在大世界里，规则会在随机时刻翻转，平均每 600 步一次，大约就是一生。这写不进基因组：时刻是不可预测的。但一生之内可以学会：每个生物都有一个口味，即从颜色到进食的一条连接，它按三因素规则改变：吃了什么、得到了什么（食物还是毒），以及学习速度有多快。学习速度是一个基因：可遗传、会突变，选择可以把它调高或调低。小世界完全相同，只是规则永不改变。",
  p3:"事先做出的预测。按照 Kozielska 与 Weissing（2024）的模型，只有在环境频繁、剧烈且不可预测地变化的地方，学习才会演化出来；而在稳定环境中先天的一方胜出，学习会被选择淘汰。我们七月的试点显示了后半句：在不变的世界里，学习速度下降了一半。这里同时检验前后两半：在变化的世界里，速度基因应当增长一个数量级；在稳定的世界里，则不应当。",
  p4:"一点诚实的说明。第一次翻转是一个瓶颈：多数带着先天口味的生物会中毒或饿死，活下来的是那些及时重新学会的。有时无人幸存，世界便重启。这不是故障，而是事先声明的失败边界（预注册 B，§7.3），在日志中这类运行会单独计数。",
  p5:"这里哪些是真的，哪些不是。你标签页里的世界是真的在计算，但它是方法的橱窗：一颗种子、一对世界，一切都随标签页消失。我们真正依据的数字在别处积累：每天 GitHub 的服务器会在新的种子上计算六种条件，观察日志则对全部已积累的数据重新统计。已声明的读数节点：10、20 和 40 颗种子。 在你的标签页里，有四点与每日运行不同：先天口味更弱、学习速度的初始值更高、社交层被关闭、预热更短。否则几乎每个世界都会在第一次翻转时死去，因为重新学习所需的能量超过了生物所拥有的。这不影响两个世界之间的比较：两者的起点相同。",
  links:'<a href="https://github.com/akela1308/minimir/blob/main/PREREGISTRATION_B.md" target="_blank" rel="noopener">预注册 B：假设、判据、失败边界</a> · <a href="journal.html">观察日志</a> · <a href="interoception.html">实验一：内感受（每周继续）</a>',
  log_h:"本浏览器中累积的回合",
  a_eps:"回合数",a_ratio:"比值中位数",a_dead:"变化世界灭绝比例",
  c_n:"№",c_seed:"种子",c_ticks:"步数",c_lrs:"速度基因，变化世界",c_lrn:"速度基因，稳定世界",c_ratio:"比值",c_out:"结局",
  out_alive:"存活",out_dead:"灭绝",clear:"清除已保存数据",
  foot:'项目与文字：<a href="https://www.ilinmaks.com/" target="_blank" rel="noopener">Maksim Ilin</a>，AI 工程师与 AI 顾问 · <a href="https://www.linkedin.com/in/ilinmaks/" target="_blank" rel="noopener">LinkedIn</a> · 浏览器中的实时橱窗，是研究的伴侣而非来源。累积数字：<a href="journal.html">日志</a> · <a href="about.html">关于</a> · <a href="https://github.com/akela1308/minimir" target="_blank" rel="noopener">github</a>。'}
};

const LKEY='minimir_lang',LDEF='en';
let LANG=(()=>{try{return localStorage.getItem(LKEY)||LDEF}catch(e){return LDEF}})();
if(!I18N[LANG])LANG=LDEF;
function t(k){return (I18N[LANG]||I18N.en)[k];}

// ---------- параметры живой пары миров ----------
// Мир B: два цвета еды. Меняющийся и стационарный запускаются от ОДНОГО семени
// и ОДНОГО предка: различие ровно одно, меняется ли правило.
const EPISODE=40000;              // длина эпизода в тиках
const SW_MEAN=600;                // средний интервал смены правила
const SPARK_EVERY=250;            // шаг выборки для спарклайна
const DEAD_PAUSE=5000;            // пауза перед перезапуском после вымирания, мс
let POOL=null,LIVECFG=null,engS=null,engC=null,epNo=0,SPEED=4;
let sparkS=[],sparkC=[],deadAt=null,deadWho=null,lastSw=0;
const cvS=document.getElementById('wS'),ctxS=cvS.getContext('2d');
const cvC=document.getElementById('wC'),ctxC=cvC.getContext('2d');
const off=document.createElement('canvas'),octx=off.getContext('2d');
let H,W,SCS,SCC,img;
const splash=document.getElementById('splash'),flash=document.getElementById('flash');

function unpackGenome(b64){const bin=atob(b64),by=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)by[i]=bin.charCodeAt(i);const f=new Float32Array(by.buffer);
  return{W1:f.slice(0,300),b1:f.slice(300,312),W2:f.slice(312,456),b2:f.slice(456,468)};}
function rndSeed(){return (Math.floor(Math.random()*4294967295))>>>0;}

function newEpisode(){
  const seed=rndSeed(),anc=POOL[(Math.random()*POOL.length)|0];
  engS=new MiniWorld.Engine(seed,Object.assign({},LIVECFG,{switchMean:SW_MEAN}),anc);
  engC=new MiniWorld.Engine(seed,Object.assign({},LIVECFG,{switchMean:0}),anc);
  engS._seed=seed;epNo++;sparkS=[];sparkC=[];deadAt=null;deadWho=null;lastSw=0;
  H=engS.cfg.H;W=engS.cfg.W;off.width=W;off.height=H;img=octx.createImageData(W,H);
  SCS=cvS.width/W;SCC=cvC.width/W;splash.style.display='none';flash.classList.remove('on');
}

// ---------- отрисовка ----------
// Цвет клетки это её постоянная география (+1 голубой, -1 янтарный). Тускнеет тот
// цвет, который сейчас ядовит: в момент смены правила экран заметно меняется.
const HUE=[[0xe0,0xa0,0x4a],[0x2e,0xb6,0xd0]];   // индексы: foodType 0 и 1
function energyColor(e){var t=e/255,r,g,b;
  if(t<.5){var u=t/.5;r=0xe8+(0xd9-0xe8)*u;g=0x73+(0xc2-0x73)*u;b=0x4a+(0x6a-0x4a)*u;}
  else{var u2=(t-.5)/.5;r=0xd9+(0x46-0xd9)*u2;g=0xc2+(0xc6-0xc2)*u2;b=0x6a+(0xd0-0x6a)*u2;}
  return `rgb(${r|0},${g|0},${b|0})`;}
function drawWorld(eng,ctx,cvw,SC){
  const d=img.data,res=eng.resource,ft=eng.foodType,gt=eng.goodType;
  for(let i=0;i<W*H;i++){
    const h=HUE[ft[i]],k=(ft[i]===gt?1:0.16)*Math.min(1,res[i]*1.6);
    d[i*4]=8+h[0]*k;d[i*4+1]=11+h[1]*k;d[i*4+2]=13+h[2]*k;d[i*4+3]=255;}
  octx.putImageData(img,0,0);ctx.imageSmoothingEnabled=false;
  ctx.clearRect(0,0,cvw.width,cvw.height);ctx.drawImage(off,0,0,cvw.width,cvw.height);
  for(let a=0;a<eng.cfg.maxPop;a++)if(eng.alive[a]){
    ctx.fillStyle=energyColor(Math.max(0,Math.min(255,eng.E[a]/eng.cfg.eMax*255)));
    ctx.fillRect(eng.x[a]*SC-0.5,eng.y[a]*SC-0.5,SC+1,SC+1);}
}

// ---------- накопление эпизодов ----------
const SKEY='minimir_b_episodes';
function loadEps(){try{return JSON.parse(localStorage.getItem(SKEY))||[]}catch(e){return[]}}
function recordEp(rec){let a=loadEps();a.push(rec);if(a.length>300)a=a.slice(-300);
  try{localStorage.setItem(SKEY,JSON.stringify(a))}catch(e){}renderLog();}
function median(a){if(!a.length)return null;const b=a.slice().sort((x,y)=>x-y);
  return b.length%2?b[(b.length-1)/2]:(b[b.length/2-1]+b[b.length/2])/2;}
function ratioOf(eng1,eng2){const a=eng1.tasteLrMedian(),b=eng2.tasteLrMedian();
  return (a==null||b==null)?null:a/Math.max(b,1e-4);}
function endEpisode(extinct){
  const lrS=engS.tasteLrMedian(),lrC=engC.tasteLrMedian();
  recordEp({n:epNo,seed:engS._seed,ticks:engS.tick,
    lrS:lrS==null?null:+lrS.toFixed(4),lrC:lrC==null?null:+lrC.toFixed(4),
    ratio:(lrS!=null&&lrC!=null)?+(lrS/Math.max(lrC,1e-4)).toFixed(2):null,
    extinct:extinct,ts:Date.now()});
}
function renderLog(){
  const b=loadEps(),rs=b.filter(e=>e.ratio!=null&&!e.extinct).map(e=>e.ratio);
  const dead=b.filter(e=>e.extinct).length;
  document.getElementById('agg').innerHTML=[
    [t('a_eps'),b.length],
    [t('a_ratio'),rs.length?'×'+median(rs).toFixed(1):'—'],
    [t('a_dead'),b.length?dead+'/'+b.length:'—'],
  ].map(([k,v])=>`<div class="aggcard"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('');
  document.getElementById('thead').innerHTML='<tr>'+['c_n','c_seed','c_ticks','c_lrs','c_lrn','c_ratio','c_out']
    .map(k=>`<th>${t(k)}</th>`).join('')+'</tr>';
  document.getElementById('tbody').innerHTML=b.slice().reverse().slice(0,50).map(e=>
    `<tr><td>${e.n}</td><td>${e.seed}</td><td>${e.ticks}</td>`+
    `<td>${e.lrS==null?'—':e.lrS.toFixed(3)}</td><td>${e.lrC==null?'—':e.lrC.toFixed(3)}</td>`+
    `<td style="color:${(e.ratio||0)>=2?'var(--coop)':'var(--dim)'}">${e.ratio==null?'—':'×'+e.ratio.toFixed(1)}</td>`+
    `<td style="color:${e.extinct?'var(--amber)':'var(--dim)'}">${e.extinct?t('out_dead'):t('out_alive')}</td></tr>`).join('');
}

// ---------- вердикт ----------
function renderVerdict(){
  const big=document.getElementById('v_big'),sub=document.getElementById('v_sub'),
        say=document.getElementById('v_say');
  if(!engS||!engC){big.textContent='—';return;}
  const lrS=engS.tasteLrMedian(),lrC=engC.tasteLrMedian(),r=ratioOf(engS,engC);
  big.textContent=r==null?'—':'×'+r.toFixed(1);
  sub.innerHTML=`${t('v_switch')} ${lrS==null?'—':lrS.toFixed(3)} · `+
                `${t('v_stat')} ${lrC==null?'—':lrC.toFixed(3)}`;
  if(deadWho==='S'){say.className='say none';say.textContent=t('v_dead_s');return;}
  if(deadWho==='C'){say.className='say none';say.textContent=t('v_dead_c');return;}
  if(!engS.switches.length){say.className='say wait';say.textContent=t('v_warm');return;}
  if(r!=null&&r>=10){say.className='say eff';say.textContent=t('v_on').replace('{n}',r.toFixed(0));}
  else if(r!=null&&r>=2){say.className='say weak';say.textContent=t('v_grow');}
  else{say.className='say none';say.textContent=t('v_same');}
}

// ---------- приборы ----------
const GA=[{k:'g_lr',u:'g_lr_u',spark:true,get:()=>engS.tasteLrMedian(),fmt:v=>v==null?'—':v.toFixed(3)},
  {k:'g_taste',u:'g_taste_u',get:()=>engS.tasteGMean(),fmt:v=>v==null?'—':v.toFixed(2)},
  {k:'g_acc',u:'g_acc_u',get:()=>engS.eatAccuracy(),fmt:v=>v==null?'—':v.toFixed(2)},
  {k:'g_sw',u:'g_sw_u',get:()=>engS.switches.length,fmt:v=>v}];
let gEls=[],sparkCv=null;
function buildGauges(){const r=document.getElementById('gauges');r.innerHTML='';gEls=[];sparkCv=null;
  for(const g of GA){const el=document.createElement('div');el.className='gauge';
    el.innerHTML=`<div class="lbl">${t(g.k)}</div><div class="val"><span data-v>—</span> <span class="unit">${t(g.u)}</span></div>`+
      (g.spark?'<canvas class="spark" width="300" height="34"></canvas>':'');
    r.appendChild(el);gEls.push({g,val:el.querySelector('[data-v]')});
    if(g.spark)sparkCv=el.querySelector('canvas');}}
function drawSpark(){
  if(!sparkCv||sparkS.length<2)return;
  const c=sparkCv.getContext('2d'),w=sparkCv.width,h=sparkCv.height;
  c.clearRect(0,0,w,h);
  const all=sparkS.concat(sparkC).filter(v=>v>0);
  if(!all.length)return;
  let lo=Math.log10(Math.min.apply(null,all)),hi=Math.log10(Math.max.apply(null,all));
  if(hi-lo<0.5){lo-=0.25;hi+=0.25;}
  const Y=v=>h-2-(Math.log10(Math.max(v,1e-4))-lo)/(hi-lo)*(h-4);
  [[sparkC,'#5b6f77'],[sparkS,'#46c6d0']].forEach(([arr,col])=>{
    if(arr.length<2)return;c.strokeStyle=col;c.lineWidth=1.3;c.beginPath();
    arr.forEach((v,i)=>{const x=i/(arr.length-1)*(w-2)+1;i?c.lineTo(x,Y(v)):c.moveTo(x,Y(v));});
    c.stroke();});
}
function updateGauges(){for(const {g,val} of gEls){const v=g.get();val.textContent=v==null?'—':g.fmt(v);}
  drawSpark();}

// ---------- цикл ----------
function loop(){
  if(engS&&engC){
    if(deadAt!==null){
      if(Date.now()-deadAt>DEAD_PAUSE)newEpisode();
    }else{
      for(let i=0;i<SPEED;i++){
        const aS=engS.step(),aC=engC.step();
        if(!aS||!aC){deadWho=aS?'C':'S';deadAt=Date.now();endEpisode(true);break;}
        if(engS.switches.length>lastSw){lastSw=engS.switches.length;
          flash.textContent=t('switched');flash.classList.add('on');
          document.getElementById('screenS').classList.add('pulse');
          setTimeout(()=>{flash.classList.remove('on');
            document.getElementById('screenS').classList.remove('pulse');},900);}
        if(engS.tick%SPARK_EVERY===0){
          sparkS.push(engS.tasteLrMedian()||0);sparkC.push(engC.tasteLrMedian()||0);
          if(sparkS.length>300){sparkS.shift();sparkC.shift();}}
        if(engS.tick%2000===0){engS.resetEat();engC.resetEat();}
        if(engS.tick>=EPISODE){endEpisode(false);newEpisode();break;}
      }
    }
    drawWorld(engS,ctxS,cvS,SCS);drawWorld(engC,ctxC,cvC,SCC);
    const gcol=engS.goodType===1?'+1':'-1';
    document.getElementById('hudS').innerHTML=
      `${t('hud_tick')} ${engS.tick} · ${engS.pop} · ${t('hud_since')} `+
      `${engS.ticksSinceSwitch()} · ${t('hud_good')} ${gcol}`;
    document.getElementById('hudC').innerHTML=`${t('hud_pop')} ${engC.pop}`;
    updateGauges();renderVerdict();
  }
  requestAnimationFrame(loop);
}

// ---------- язык ----------
function applyLang(l){
  if(!I18N[l])l=LDEF;LANG=l;try{localStorage.setItem(LKEY,l)}catch(e){}
  document.documentElement.lang=l;const S=id=>document.getElementById(id);
  S('t_eye').textContent=t('eye');S('t_exp1').textContent=t('exp1');
  S('t_journal').textContent=t('journal');S('t_agi').textContent=t('agi');
  S('t_about').textContent=t('about');
  S('t_brand').innerHTML=t('brand');S('t_live').textContent=t('live');S('t_lede').textContent=t('lede');
  S('t_wswitch').textContent=t('wswitch');S('t_wstat').textContent=t('wstat');
  S('t_speed').textContent=t('speed');S('newbtn').textContent=t('newworld');
  S('t_verdict_h').textContent=t('verdict_h');S('t_how_h').textContent=t('how_h');
  S('t_log_h').textContent=t('log_h');S('clearbtn').textContent=t('clear');
  S('t_foot').innerHTML=t('foot');S('splash').textContent=t('seeding');
  S('linksbox').innerHTML=t('links');
  S('howbox').innerHTML=['p1','p2','p3','p4','p5']
    .map((k,i)=>`<p style="margin:${i?'12px':'0'} 0 0">${t(k)}</p>`).join('');
  S('legend').innerHTML=
    `<span><i style="background:#2eb6d0"></i>${t('lg_edible')} (+1)</span>`+
    `<span><i style="background:#3a2f1c"></i>${t('lg_toxic')} (-1)</span>`+
    `<span><i style="background:#d9c26a"></i>${t('lg_creature')}</span>`;
  document.querySelectorAll('.langbar button').forEach(b=>b.classList.toggle('on',b.dataset.set===l));
  buildGauges();renderLog();renderVerdict();
}
document.querySelector('.langbar').addEventListener('click',e=>{const b=e.target.closest('button[data-set]');if(b)applyLang(b.dataset.set);});
document.getElementById('speed').addEventListener('click',e=>{const b=e.target.closest('button[data-s]');if(!b)return;
  SPEED=+b.dataset.s;document.querySelectorAll('#speed button').forEach(x=>x.classList.toggle('on',x===b));});
document.getElementById('newbtn').onclick=()=>{if(POOL)newEpisode();};
document.getElementById('clearbtn').onclick=()=>{try{localStorage.removeItem(SKEY)}catch(e){}renderLog();};

applyLang(LANG);
splash.style.display='flex';splash.textContent=t('seeding');
fetch('ancestors_b.json').then(r=>r.json()).then(d=>{
  // Отличия витрины от суточного прогона, все четыре вынужденные и заявлены
  // в тексте страницы:
  //   вкус 1.5 вместо 3.0 и стартовая скорость обучения 0.5 вместо 0.1 —
  //     иначе переучивание стоит больше энергии, чем у существа есть (тридцать
  //     отравлений по пять единиц при запасе в сто), и первую же смену
  //     правила не переживает никто;
  //   социальный слой выключен — предки мира B отбирались без него;
  //   прогрев 3000 тиков вместо 5000 — чтобы витрину не ждали минуту.
  // Сравнение двух миров от этого не страдает: у обоих старт одинаковый.
  // Потолок численности заведомо большой: плотность регулируется едой
  // и теснотой, а не константой.
  LIVECFG=Object.assign({},d.cfg,{maxPop:2500,tasteInit:1.5,tasteLrInit:0.5,
    switchFromTick:3000,socialFromTick:1e9,actionNoise:0});
  POOL=d.ancestors.map(unpackGenome);newEpisode();loop();})
  .catch(err=>{splash.textContent='error: '+err;});
</script>
