name: суточный прогон

# Автономный накопительный эксперимент: раз в сутки движок мира считает
# новые независимые seed'ы главного сравнения (self / shuffled / neighbour /
# off), результаты дописываются в репозиторий, журнал наблюдений на сайте
# пересобирается. Ничей ноутбук при этом включён быть не должен.

on:
  schedule:
    # 02:20 UTC ежедневно (04:20 по Загребу летом). Минуты не круглые нарочно:
    # в круглый час очередь раннеров GitHub самая длинная.
    - cron: "20 2 * * *"
  workflow_dispatch:
    inputs:
      seeds:
        description: "сколько новых seed'ов посчитать"
        required: false
        default: "4"
      ticks:
        description: "длина прогона в тиках (менять только осознанно)"
        required: false
        default: "120000"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: minimir-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: зависимости
        run: pip install --quiet numpy scipy pytest

      - name: тесты движка (прогон не должен идти по сломанному коду)
        run: python -m pytest tests -q

      - name: суточный прогон
        run: |
          python runs/daily.py \
            --seeds "${{ github.event.inputs.seeds || '4' }}" \
            --ticks "${{ github.event.inputs.ticks || '120000' }}" \
            --workers 3

      - name: пересборка журнала
        run: python runs/journal.py

      - name: коммит результатов
        run: |
          git config user.name  "minimir daily"
          git config user.email "actions@users.noreply.github.com"
          git add runs/daily docs/journal.html docs/journal.json
          if git diff --cached --quiet; then
            echo "нечего коммитить"
            exit 0
          fi
          N=$(python -c "import json;print(json.load(open('docs/journal.json'))['n_seeds'])")
          git commit -m "Daily run: accumulate seeds, ${N} total"
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: сводка в интерфейс Actions
        if: always()
        run: |
          echo "### Суточный прогон" >> $GITHUB_STEP_SUMMARY
          python - <<'PY' >> $GITHUB_STEP_SUMMARY
          import json, pathlib
          p = pathlib.Path("docs/journal.json")
          if p.exists():
              s = json.load(open(p))
              c = s["comparisons"].get("self", {})
              print(f"- seed'ов: **{s['n_seeds']}** из {s['target']}")
              print(f"- вердикт: **{s['verdict']}**")
              print(f"- Δ(self−shuffled) = {c.get('mean_diff')}, p = {c.get('p')}")
              print(f"- 2σ = {s.get('two_sigma')}")
          else:
              print("журнал не собран")
          PY

  # Коммит, сделанный шагом выше, сам по себе workflow «публикация сайта»
  # не запускает — поэтому вызываем её явно, иначе журнал обновился бы
  # в репозитории, но не на сайте.
  publish:
    needs: run
    uses: ./.github/workflows/pages.yml
