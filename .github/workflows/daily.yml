name: суточный прогон

# Автономный накопительный эксперимент. Два протокола в одном расписании:
#   * B «Когда выгодно учиться» (runs/daily_b.py): каждый день, 2 новых seed'а;
#   * A «интероцепция» (runs/daily.py): раз в неделю, по воскресеньям, 4 seed'а.
#     Оба объявленных чтения A (20 и 40) уже прошли; накопление продолжается
#     ради уточнения оценки.
# Результаты дописываются в репозиторий, журнал на сайте пересобирается.
# Ничей ноутбук при этом включён быть не должен.

on:
  schedule:
    # 02:20 UTC ежедневно (04:20 по Загребу летом). Минуты не круглые нарочно:
    # в круглый час очередь раннеров GitHub самая длинная.
    - cron: "20 2 * * *"
  workflow_dispatch:
    inputs:
      seeds_b:
        description: "протокол B: сколько новых seed'ов посчитать"
        required: false
        default: "2"
      ticks_b:
        description: "протокол B: длина прогона в тиках (менять только осознанно)"
        required: false
        default: "100000"
      run_a:
        description: "запустить и протокол A (обычно только по воскресеньям)"
        required: false
        default: "no"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: minimir-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: зависимости
        run: pip install --quiet numpy scipy pytest

      - name: тесты движка (прогон не должен идти по сломанному коду)
        run: python -m pytest tests -q

      - name: протокол B, каждый день
        run: |
          python runs/daily_b.py \
            --seeds "${{ github.event.inputs.seeds_b || '2' }}" \
            --ticks "${{ github.event.inputs.ticks_b || '100000' }}" \
            --workers 2

      - name: протокол A, по воскресеньям
        run: |
          if [ "$(date -u +%u)" = "7" ] || [ "${{ github.event.inputs.run_a }}" = "yes" ]; then
            python runs/daily.py --seeds 4 --ticks 120000 --workers 2 --target 100
          else
            echo "не воскресенье: протокол A пропущен"
          fi

      - name: пересборка журнала
        run: python runs/journal.py

      - name: коммит результатов
        run: |
          git config user.name  "minimir daily"
          git config user.email "actions@users.noreply.github.com"
          git add runs/daily docs/journal.html docs/journal.json docs/journal_b.json
          if git diff --cached --quiet; then
            echo "нечего коммитить"
            exit 0
          fi
          NB=$(python -c "import json;print(json.load(open('docs/journal_b.json'))['n_seeds'])")
          NA=$(python -c "import json;print(json.load(open('docs/journal.json'))['n_seeds'])")
          git commit -m "Daily run: B ${NB} seeds, A ${NA} seeds"
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: сводка в интерфейс Actions
        if: always()
        run: |
          echo "### Суточный прогон" >> $GITHUB_STEP_SUMMARY
          python - <<'PY' >> $GITHUB_STEP_SUMMARY
          import json, pathlib
          pb = pathlib.Path("docs/journal_b.json")
          if pb.exists():
              s = json.load(open(pb))
              c = s["comparisons"].get("life_vs_never", {})
              print(f"**Протокол B**: seed'ов **{s['n_seeds']}** из {s['target']}, вердикт **{s['verdict']}**, "
                    f"life/never = ×{c.get('ratio')}, p = {c.get('p')}")
          p = pathlib.Path("docs/journal.json")
          if p.exists():
              s = json.load(open(p))
              c = s["comparisons"].get("self", {})
              print(f"\n**Протокол A**: seed'ов **{s['n_seeds']}**, вердикт **{s['verdict']}**, "
                    f"Δ = {c.get('mean_diff')}, p = {c.get('p')}")
          PY

  # Коммит, сделанный шагом выше, сам по себе workflow «публикация сайта»
  # не запускает — поэтому вызываем её явно, иначе журнал обновился бы
  # в репозитории, но не на сайте.
  publish:
    needs: run
    uses: ./.github/workflows/pages.yml
